<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up — EcoLife | Team .Tensor</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Client Helper -->
  <script src="supabaseClient.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* WebGL Shader Canvas */
    #dotCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    /* Radial Vignette Overlay */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.95) 100%);
      pointer-events: none;
    }

    /* Top Left Header Brand Logo */
    .brand-header {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      z-index: 10;
    }
    .brand-header span.dot {
      color: #77CC7D;
    }

    /* Modern Modal Card */
    .auth-modal {
      position: relative;
      z-index: 2;
      background: #121212;
      border: 1px solid #222222;
      border-radius: 14px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(119, 204, 125, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Brand Logo Pill inside card */
    .logo-badge {
      background: #111111;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 0.85rem;
      border: 1px solid #333333;
      color: #77CC7D;
    }

    .auth-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.025em;
      font-family: 'Space Grotesk', sans-serif;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: #888888;
      margin-bottom: 1.1rem;
      line-height: 1.5;
    }

    /* Form Inputs */
    .auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .form-input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #333333;
      background: #000000;
      color: #ffffff;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      border-color: #77CC7D;
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: none;
      background: #ededed;
      color: #000000;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-submit:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #222222;
      width: 100%;
      margin: 0.95rem 0;
    }

    /* Social Buttons */
    .btn-social {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #333333;
      background: transparent;
      color: #ffffff;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      transition: background 0.2s ease;
    }
    .btn-social:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #444444;
    }

    /* Toggle & Footer */
    .toggle-row {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: #888888;
    }
    .toggle-btn {
      color: #ffffff;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      text-decoration: underline;
    }

    .footer-text {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #666666;
      line-height: 1.5;
      text-align: center;
    }
    .footer-text a {
      color: #888888;
      text-decoration: underline;
    }

    /* Alert Message */
    .alert-box {
      width: 100%;
      margin-top: 0.75rem;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      display: none;
      text-align: center;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-box.success {
      display: block;
      background: rgba(119, 204, 125, 0.15);
      border: 1px solid rgba(119, 204, 125, 0.4);
      color: #77CC7D;
    }
  </style>
</head>
<body>
  <!-- WebGL Three.js Shader Canvas -->
  <canvas id="dotCanvas"></canvas>

  <!-- Vignette Overlay -->
  <div class="vignette-overlay"></div>

  <!-- Header Logo -->
  <a href="index.html" class="brand-header">
    .Tensor<span class="dot">.</span>
  </a>

  <!-- Auth Card -->
  <div class="auth-modal">
    <div class="logo-badge">.T</div>

        </svg>
        Continue with GitHub
      </button>

      <div class="toggle-row">
        Don't have an account?
        <button onclick="toggleView('signup')" class="toggle-btn">Sign Up</button>
      </div>
    </div>

    <!-- Sign Up View -->
    <div id="viewSignup" style="width: 100%; display: none;">
      <h1 class="auth-title">Sign up for EcoLife</h1>

      <form onsubmit="handleAuthSubmit(event, 'signup')" class="auth-form">
        <input class="form-input" type="text" id="signupName" placeholder="Full Name" required/>
        <input class="form-input" type="email" id="signupEmail" placeholder="name@work-email.com" required/>
        <input class="form-input" type="password" id="signupPassword" placeholder="Password (min 6 chars)" required/>
        <button type="submit" class="btn-submit" id="btnSignupSubmit">Sign Up with Email →</button>

      <div class="divider"></div>

      <button class="btn-social" onclick="handleSocialAuth('Google')">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign up with Google
      </button>

      <button class="btn-social" onclick="handleSocialAuth('GitHub')">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;flex-shrink:0;">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.699-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        Sign up with GitHub
      </button>

      <div class="toggle-row">
        Already have an account?
        <button onclick="toggleView('signin')" class="toggle-btn">Sign In</button>
      </div>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert-box"></div>

    <div class="footer-text">
      By proceeding, you agree to EcoLife's<br/>
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <!-- WebGL Shader Script -->
  <script>
    // Initialize Three.js Dot Grid Shader
    function initDotShader() {
      const canvas = document.getElementById('dotCanvas');
      if (!canvas || !window.THREE) return;

      const THREE = window.THREE;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) },
        u_opacities: { value: [0.2, 0.3, 0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0] },
        u_colors: { value: [
          new THREE.Vector3(0.46, 0.8, 0.49),
          new THREE.Vector3(1, 1, 1),
          new THREE.Vector3(0.46, 0.8, 0.49),
          new THREE.Vector3(1, 1, 1),
          new THREE.Vector3(0.46, 0.8, 0.49),
          new THREE.Vector3(1, 1, 1)
        ] },
        u_total_size: { value: 20.0 },
        u_dot_size: { value: 5.5 }
      };

      const material = new THREE.ShaderMaterial({
        vertexShader: `
          precision mediump float;
          uniform vec2 u_resolution;
          out vec2 fragCoord;
          void main() {
            gl_Position = vec4(position, 1.0);
            fragCoord = (position.xy + 1.0) * 0.5 * u_resolution;
            fragCoord.y = u_resolution.y - fragCoord.y;
          }
        `,
        fragmentShader: `
          precision mediump float;
          in vec2 fragCoord;

          uniform float u_time;
          uniform float u_opacities[10];
          uniform vec3 u_colors[6];
          uniform float u_total_size;
          uniform float u_dot_size;
          uniform vec2 u_resolution;

          out vec4 fragColor;

          float PHI = 1.61803398874989484820459;
          float random(vec2 xy) {
              return fract(tan(distance(xy * PHI, xy) * 0.5) * xy.x);
          }

          void main() {
              vec2 st = fragCoord.xy;
              st.x -= abs(floor((mod(u_resolution.x, u_total_size) - u_dot_size) * 0.5));
              st.y -= abs(floor((mod(u_resolution.y, u_total_size) - u_dot_size) * 0.5));

              float opacity = step(0.0, st.x) * step(0.0, st.y);

              vec2 st2 = vec2(int(st.x / u_total_size), int(st.y / u_total_size));

              float frequency = 5.0;
              float show_offset = random(st2);
              float rand = random(st2 * floor((u_time / frequency) + show_offset + frequency));
              opacity *= u_opacities[int(rand * 10.0)];
              opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.x / u_total_size));
              opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.y / u_total_size));

              vec3 color = u_colors[int(show_offset * 6.0)];

              float animation_speed_factor = 2.5;
              vec2 center_grid = u_resolution / 2.0 / u_total_size;
              float dist_from_center = distance(center_grid, st2);

              float timing_offset_intro = dist_from_center * 0.01 + (random(st2) * 0.15);

              float current_timing_offset = timing_offset_intro;
              opacity *= step(current_timing_offset, u_time * animation_speed_factor);
              opacity *= clamp((1.0 - step(current_timing_offset + 0.1, u_time * animation_speed_factor)) * 1.25, 1.0, 1.25);

              fragColor = vec4(color, opacity);
              fragColor.rgb *= fragColor.a;
          }
        `,
        uniforms: uniforms,
        glslVersion: THREE.GLSL3,
        blending: THREE.CustomBlending,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        transparent: true
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const startTime = performance.now();
      function animate() {
        requestAnimationFrame(animate);
        uniforms.u_time.value = (performance.now() - startTime) / 1000.0;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth * 2, window.innerHeight * 2);
      });
    }

    document.addEventListener('DOMContentLoaded', initDotShader);
  </script>

  <!-- Auth Controller Script -->
  <script>
    function toggleView(mode) {
      const viewSignin = document.getElementById('viewSignin');
      const viewSignup = document.getElementById('viewSignup');
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      if (mode === 'signup') {
        viewSignin.style.display = 'none';
        viewSignup.style.display = 'block';
      } else {
        viewSignup.style.display = 'none';
        viewSignin.style.display = 'block';
      }
    }

    async function handleAuthSubmit(event, mode) {
      event.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      let email, password, fullName;
      if (mode === 'signup') {
        fullName = document.getElementById('signupName').value.trim();
        email = document.getElementById('signupEmail').value.trim();
        password = document.getElementById('signupPassword').value.trim();
      } else {
        email = document.getElementById('signinEmail').value.trim();
        password = document.getElementById('signinPassword').value.trim();
      }

      const btn = mode === 'signup' ? document.getElementById('btnSignupSubmit') : document.getElementById('btnSigninSubmit');
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        let res;
        if (mode === 'signup') {
          res = await EcoAuth.signUp(email, password, fullName);
        } else {
          res = await EcoAuth.signIn(email, password);
        }

        if (res.success) {
          alertBox.className = 'alert-box success';
          alertBox.textContent = mode === 'signup' ? 'Account created! Redirecting...' : 'Signed in! Redirecting...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          alertBox.className = 'alert-box error';
          alertBox.textContent = res.message || 'Authentication failed.';
          btn.disabled = false;
          btn.textContent = mode === 'signup' ? 'Sign Up with Email →' : 'Continue with Email →';
        }
      } catch (err) {
        alertBox.className = 'alert-box error';
        alertBox.textContent = err.message || 'An error occurred.';
        btn.disabled = false;
        btn.textContent = mode === 'signup' ? 'Sign Up with Email →' : 'Continue with Email →';
      }
    }

    async function handleSocialAuth(provider) {
      const email = `user_${Math.floor(Math.random() * 1000)}@${provider.toLowerCase()}.com`;
      const res = await EcoAuth.signIn(email, "social_pass_123");
      if (res.success) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert-box success';
        alertBox.textContent = `Signed in with ${provider}! Redirecting...`;
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      }
    }
  </script>
</body>
</html>
