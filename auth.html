<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In / Sign Up — EcoLife | Team .Tensor</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Client Helper -->
  <script src="supabaseClient.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Radial Ambient Background Glows */
    .glow-bg-1 {
      position: absolute;
      top: -10%;
      left: 30%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(119, 204, 125, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }
    .glow-bg-2 {
      position: absolute;
      bottom: -10%;
      right: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(22, 101, 52, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    /* Top Left Header Brand */
    .brand-header {
      position: absolute;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      z-index: 10;
    }
    .brand-header span.dot {
      color: #77CC7D;
    }

    /* Auth Glass Card */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 18, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(119, 204, 125, 0.08);
      z-index: 5;
      position: relative;
    }

    /* Tab Switches */
    .tab-row {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-weight: 600;
      font-size: 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    .auth-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .auth-subtitle {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #d4d4d8;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      border-color: #77CC7D;
      box-shadow: 0 0 0 3px rgba(119, 204, 125, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
    }
    .btn-submit:hover {
      background: #f4f4f5;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
    }

    /* Alert Message */
    .alert-msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .alert-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-msg.success {
      display: block;
      background: rgba(119, 204, 125, 0.15);
      border: 1px solid rgba(119, 204, 125, 0.4);
      color: #77CC7D;
    }

    /* Footer Back Link */
    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #a1a1aa;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .back-home:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <a href="index.html" class="brand-header">
    .Tensor<span class="dot">.</span>
  </a>

  <div class="auth-card">
    <div class="tab-row">
      <button class="tab-btn active" id="tabSignin" onclick="setMode('signin')">Sign In</button>
      <button class="tab-btn" id="tabSignup" onclick="setMode('signup')">Create Account</button>
    </div>

    <h2 class="auth-title" id="authTitle">Welcome Back</h2>
    <p class="auth-subtitle" id="authSubtitle">Sign in to sync your carbon logs and eco stats.</p>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Ricco Mallick">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Sign In →</button>
      <div class="alert-msg" id="alertMsg"></div>
    </form>

    <a href="index.html" class="back-home">← Back to Landing Page</a>
  </div>

  <script>
    let mode = 'signin';

    function setMode(newMode) {
      mode = newMode;
      const tabSignin = document.getElementById('tabSignin');
      const tabSignup = document.getElementById('tabSignup');
      const nameGroup = document.getElementById('nameGroup');
      const authTitle = document.getElementById('authTitle');
      const authSubtitle = document.getElementById('authSubtitle');
      const btnSubmit = document.getElementById('btnSubmit');
      const alertMsg = document.getElementById('alertMsg');

      alertMsg.className = 'alert-msg';
      alertMsg.style.display = 'none';

      if (mode === 'signin') {
        tabSignin.classList.add('active');
        tabSignup.classList.remove('active');
        nameGroup.style.display = 'none';
        authTitle.textContent = 'Welcome Back';
        authSubtitle.textContent = 'Sign in to sync your carbon logs and eco stats.';
        btnSubmit.textContent = 'Sign In →';
      } else {
        tabSignup.classList.add('active');
        tabSignin.classList.remove('active');
        nameGroup.style.display = 'flex';
        authTitle.textContent = 'Join EcoLife';
        authSubtitle.textContent = 'Create an account to start tracking your environmental footprint.';
        btnSubmit.textContent = 'Create Account →';
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const alertMsg = document.getElementById('alertMsg');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!email || !password) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Authenticating...';
      alertMsg.className = 'alert-msg';
      alertMsg.style.display = 'none';

      try {
        let res;
        if (mode === 'signup') {
          res = await EcoAuth.signUp(email, password, fullName);
        } else {
          res = await EcoAuth.signIn(email, password);
        }

        if (res.success) {
          alertMsg.className = 'alert-msg success';
          alertMsg.textContent = mode === 'signup' ? 'Account created! Redirecting...' : 'Signed in successfully! Redirecting...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          alertMsg.className = 'alert-msg error';
          alertMsg.textContent = res.message || 'Authentication failed. Please check your details.';
          btnSubmit.disabled = false;
          btnSubmit.textContent = mode === 'signin' ? 'Sign In →' : 'Create Account →';
        }
      } catch (err) {
        alertMsg.className = 'alert-msg error';
        alertMsg.textContent = err.message || 'An unexpected error occurred.';
        btnSubmit.disabled = false;
        btnSubmit.textContent = mode === 'signin' ? 'Sign In →' : 'Create Account →';
      }
    }
  </script>
</body>
</html>
