<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — EcoLife | Team .Tensor</title>
  <meta name="description" content="Sign in to EcoLife — your sustainable living dashboard by Team .Tensor."/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Client Helper -->
  <script src="supabaseClient.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: #050505;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* WebGL Canvas */
    #canvas {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
    }

    /* Radial fade overlay */
    .overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 20%, rgba(0,0,0,0.82) 100%);
    }

    /* Brand top-left */
    .brand {
      position: fixed; top: 24px; left: 28px; z-index: 20;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none; color: #fff;
      font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em;
    }
    .brand-dot { color: #5ddb6a; }

    /* Glassmorphism card */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 400px;
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2.5rem 2.25rem 2rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex; flex-direction: column; align-items: center;
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* Logo badge */
    .logo-badge {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #1a2e1a, #0d1f0d);
      border: 1px solid rgba(93,219,106,0.25);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.1rem; color: #5ddb6a;
      margin-bottom: 1.1rem;
      box-shadow: 0 0 20px rgba(93,219,106,0.12);
    }

    .title {
      font-size: 1.45rem; font-weight: 700;
      letter-spacing: -0.03em; margin-bottom: 0.3rem;
      text-align: center;
    }
    .subtitle {
      font-size: 0.83rem; color: #777; line-height: 1.55;
      text-align: center; margin-bottom: 1.8rem;
    }

    /* Buttons */
    .btn {
      width: 100%; padding: 0.78rem 1rem;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #fff; font-family: inherit;
      font-weight: 500; font-size: 0.9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.7rem;
      margin-bottom: 0.6rem;
      transition: background 0.18s, border-color 0.18s, transform 0.15s, box-shadow 0.18s;
      position: relative; overflow: hidden;
    }
    .btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }

    /* Google button accent */
    .btn-google {
      border-color: rgba(255,255,255,0.14);
    }
    .btn-google:hover:not(:disabled) {
      background: rgba(66,133,244,0.08);
      border-color: rgba(66,133,244,0.3);
    }

    /* Loading state */
    .btn.loading { pointer-events: none; opacity: 0.7; }
    .btn.loading .btn-label { opacity: 0; }
    .btn.loading::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider */
    .divider {
      width: 100%; display: flex; align-items: center; gap: 0.75rem;
      margin: 0.5rem 0 0.9rem;
      color: #444; font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.07);
    }

    /* Coming soon buttons */
    .btn-soon {
      opacity: 0.38; cursor: not-allowed;
      pointer-events: none; margin-bottom: 0.6rem;
    }
    .soon-tag {
      font-size: 0.68rem; color: #555; font-style: italic; margin-left: 0.3rem;
    }

    /* Footer */
    .footer {
      margin-top: 1.4rem; font-size: 0.73rem; color: #4a4a4a;
      line-height: 1.6; text-align: center;
    }
    .footer a { color: #666; text-decoration: underline; }
    .footer a:hover { color: #999; }

    /* Alert */
    .alert {
      width: 100%; margin-top: 0.9rem; padding: 10px 14px;
      border-radius: 8px; font-size: 0.82rem; text-align: center;
      display: none; animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    .alert.error {
      display: block;
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5;
    }
    .alert.success {
      display: block;
      background: rgba(93,219,106,0.1); border: 1px solid rgba(93,219,106,0.3); color: #5ddb6a;
    }

    /* Mobile safe */
    @media (max-width: 440px) {
      .card { margin: 1rem; padding: 2rem 1.5rem 1.75rem; border-radius: 16px; }
      .brand { top: 18px; left: 18px; }
    }
  </style>
</head>
<body>
  <!-- WebGL Dot Canvas -->
  <canvas id="canvas"></canvas>
  <div class="overlay"></div>

  <!-- Brand -->
  <a href="index.html" class="brand">.Tensor<span class="brand-dot">.</span></a>

  <!-- Auth Card -->
  <div class="card">
    <div class="logo-badge">🌱</div>
    <h1 class="title">Welcome to EcoLife</h1>
    <p class="subtitle">Sign in to track your eco impact,<br>earn points, and help the planet.</p>

    <!-- Google OAuth — active -->
    <button id="googleBtn" type="button" class="btn btn-google" onclick="handleSocialAuth('google', this)">
      <span class="btn-label" style="display:flex;align-items:center;gap:0.7rem;">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;flex-shrink:0;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </span>
    </button>

    <!-- Divider before coming soon -->
    <div class="divider">more options</div>

    <!-- GitHub — coming soon -->
    <button type="button" class="btn btn-soon" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;flex-shrink:0;">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.699-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      Continue with GitHub
      <span class="soon-tag">(coming soon)</span>
    </button>

    <!-- Apple — coming soon -->
    <button type="button" class="btn btn-soon" style="margin-bottom:0;" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;flex-shrink:0;">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.56.04 2.88.75 3.65 1.89-3.08 1.75-2.58 5.61.35 6.75-1.01 2.37-2.39 4.39-4.29 4.29zM12.03 7.25c-.15-2.23 1.66-4.07 3.72-4.25.36 2.38-1.92 4.34-3.72 4.25z"/>
      </svg>
      Continue with Apple
      <span class="soon-tag">(coming soon)</span>
    </button>

    <!-- Alert -->
    <div id="alertBox" class="alert"></div>

    <div class="footer">
      By continuing, you agree to EcoLife's<br/>
      <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
    </div>
  </div>

  <!-- WebGL Shader -->
  <script>
    function initThreeShader() {
      const canvas = document.getElementById('canvas');
      if (!canvas || !window.THREE) return;
      const THREE = window.THREE;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) },
        u_opacities: { value: [0.3, 0.3, 0.3, 0.5, 0.5, 0.5, 0.8, 0.8, 0.8, 1.0] },
        u_colors: { value: [
          new THREE.Vector3(1,1,1), new THREE.Vector3(1,1,1),
          new THREE.Vector3(0.36,0.86,0.42), new THREE.Vector3(0.36,0.86,0.42),
          new THREE.Vector3(1,1,1), new THREE.Vector3(0.36,0.86,0.42)
        ]},
        u_total_size: { value: 22.0 },
        u_dot_size:   { value: 5.0 },
        u_reverse:    { value: 0 }
      };
      const material = new THREE.ShaderMaterial({
        vertexShader: `
          precision mediump float;
          uniform vec2 u_resolution;
          out vec2 fragCoord;
          void main() {
            gl_Position = vec4(position, 1.0);
            fragCoord = (position.xy + 1.0) * 0.5 * u_resolution;
            fragCoord.y = u_resolution.y - fragCoord.y;
          }`,
        fragmentShader: `
          precision mediump float;
          in vec2 fragCoord;
          uniform float u_time;
          uniform float u_opacities[10];
          uniform vec3 u_colors[6];
          uniform float u_total_size;
          uniform float u_dot_size;
          uniform vec2 u_resolution;
          uniform int u_reverse;
          out vec4 fragColor;
          float PHI = 1.61803398874989484820459;
          float random(vec2 xy) { return fract(tan(distance(xy * PHI, xy) * 0.5) * xy.x); }
          void main() {
            vec2 st = fragCoord.xy;
            st.x -= abs(floor((mod(u_resolution.x, u_total_size) - u_dot_size) * 0.5));
            st.y -= abs(floor((mod(u_resolution.y, u_total_size) - u_dot_size) * 0.5));
            float opacity = step(0.0, st.x) * step(0.0, st.y);
            vec2 st2 = vec2(int(st.x / u_total_size), int(st.y / u_total_size));
            float frequency = 5.0;
            float show_offset = random(st2);
            float rand = random(st2 * floor((u_time / frequency) + show_offset + frequency));
            opacity *= u_opacities[int(rand * 10.0)];
            opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.x / u_total_size));
            opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.y / u_total_size));
            vec3 color = u_colors[int(show_offset * 6.0)];
            float animation_speed_factor = 3.0;
            vec2 center_grid = u_resolution / 2.0 / u_total_size;
            float dist_from_center = distance(center_grid, st2);
            float timing_offset_intro = dist_from_center * 0.01 + (random(st2) * 0.15);
            opacity *= step(timing_offset_intro, u_time * animation_speed_factor);
            opacity *= clamp((1.0 - step(timing_offset_intro + 0.1, u_time * animation_speed_factor)) * 1.25, 1.0, 1.25);
            fragColor = vec4(color, opacity);
            fragColor.rgb *= fragColor.a;
          }`,
        uniforms,
        glslVersion: THREE.GLSL3,
        blending: THREE.CustomBlending,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        transparent: true
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      scene.add(mesh);
      const t0 = performance.now();
      (function animate() {
        requestAnimationFrame(animate);
        uniforms.u_time.value = (performance.now() - t0) / 1000;
        renderer.render(scene, camera);
      })();
      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth * 2, window.innerHeight * 2);
      });
    }
    document.addEventListener('DOMContentLoaded', initThreeShader);
  </script>

  <!-- Auth Logic -->
  <script>
    const DASHBOARD_URL = window.location.href.includes('github.io')
      ? 'https://ricco-mallick.github.io/ecolife-tensor/dashboard.html#overview'
      : window.location.origin + '/dashboard.html#overview';

    // If already signed in, go straight to dashboard
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (typeof EcoAuth !== 'undefined') {
          const user = await EcoAuth.getCurrentUser();
          if (user) {
            window.location.replace(DASHBOARD_URL);
            return;
          }
        }
      } catch (e) { /* not signed in */ }
    });

    async function handleSocialAuth(provider, btn) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert';
      alertBox.style.display = 'none';

      // Show loading spinner
      btn.classList.add('loading');

      try {
        const res = await EcoAuth.signInWithOAuth(provider);
        if (!res.success) {
          btn.classList.remove('loading');
          alertBox.className = 'alert error';
          alertBox.textContent = res.message || 'Sign-in failed. Please try again.';
        }
        // On success Supabase handles the redirect automatically
      } catch (err) {
        btn.classList.remove('loading');
        alertBox.className = 'alert error';
        alertBox.textContent = 'Unexpected error: ' + (err.message || err);
      }
    }
  </script>
</body>
</html>
