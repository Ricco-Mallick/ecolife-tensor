<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Originkit Globe with React Bits Galaxy Background</title>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Full D3 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <!-- OGL ESM Bundle exported to window.OGL -->
  <script type="module">
    import * as OGL from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';
    window.OGL = OGL;
  </script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      position: relative;
    }

    .galaxy-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .globe-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, Component } = React;

    // Error Boundary Component
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Globe Page Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ color: '#ff6b6b', padding: '32px', fontFamily: 'monospace', textAlign: 'center' }}>
              <h2>Render Error Occurred</h2>
              <pre style={{ marginTop: '16px', background: '#111', padding: '16px', borderRadius: '4px' }}>
                {this.state.error && this.state.error.toString()}
              </pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- REACT BITS GALAXY SHADER SOURCES ---
    const galaxyVertexShader = `
attribute vec2 uv;
attribute vec2 position;

varying vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 0, 1);
}
`;

    const galaxyFragmentShader = `
precision highp float;

uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;

varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) {
  return abs(fract(x) * 2.0 - 1.0);
}

float tris(float x) {
  float t = fract(x);
  return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
}

float trisn(float x) {
  float t = fract(x);
  return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);

  vec2 gv = fract(uv) - 0.5; 
  vec2 id = floor(uv);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));

      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

      float star = Star(gv - offset - pad, flareSize);
      vec3 color = base;

      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      
      col += star * size * color;
    }
  }

  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

  vec2 mouseNorm = uMouse - vec2(0.5);
  
  if (uAutoCenterRepulsion > 0.0) {
    vec2 centerUV = vec2(0.0, 0.0);
    float centerDist = length(uv - centerUV);
    vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
    uv += repulsion * 0.05;
  } else if (uMouseRepulsion) {
    vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
    float mouseDist = length(uv - mousePosUV);
    vec2 repulsion = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1));
    uv += repulsion * 0.05 * uMouseActiveFactor;
  } else {
    vec2 mouseOffset = mouseNorm * 0.1 * uMouseActiveFactor;
    uv += mouseOffset;
  }

  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;

  uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

  vec3 col = vec3(0.0);

  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }

  if (uTransparent) {
    float alpha = clamp(length(col) * 3.0, 0.0, 1.0);
    gl_FragColor = vec4(col * 2.5, alpha);
  } else {
    gl_FragColor = vec4(col * 2.5, 1.0);
  }
}
`;

    function Galaxy({
      focal = [0.5, 0.5],
      rotation = [1.0, 0.0],
      starSpeed = 0.5,
      density = 2.5,
      hueShift = 240,
      disableAnimation = false,
      speed = 1.0,
      mouseInteraction = true,
      glowIntensity = 2.0,
      saturation = 1.0,
      mouseRepulsion = true,
      repulsionStrength = 2,
      twinkleIntensity = 0.6,
      rotationSpeed = 0.15,
      autoCenterRepulsion = 0,
      transparent = true,
      className = ""
    }) {
      const ctnDom = useRef(null);
      const targetMousePos = useRef({ x: 0.5, y: 0.5 });
      const smoothMousePos = useRef({ x: 0.5, y: 0.5 });
      const targetMouseActive = useRef(0.0);
      const smoothMouseActive = useRef(0.0);

      useEffect(() => {
        let isMounted = true;
        let animateId;
        let ctn;
        let renderer;
        let gl;

        function startGL() {
          if (!isMounted || !ctnDom.current) return;
          const OGL_LIB = window.OGL;
          if (!OGL_LIB || !OGL_LIB.Renderer) {
            setTimeout(startGL, 50);
            return;
          }

          const { Renderer: OGLRenderer, Program: OGLProgram, Mesh: OGLMesh, Color: OGLColor, Geometry: OGLGeometry } = OGL_LIB;
          ctn = ctnDom.current;

          renderer = new OGLRenderer({
            alpha: transparent,
            premultipliedAlpha: false
          });
          gl = renderer.gl;

          gl.canvas.style.position = "absolute";
          gl.canvas.style.top = "0";
          gl.canvas.style.left = "0";
          gl.canvas.style.width = "100%";
          gl.canvas.style.height = "100%";
          gl.canvas.style.pointerEvents = "none";

          if (transparent) {
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.clearColor(0, 0, 0, 0);
          } else {
            gl.clearColor(0, 0, 0, 1);
          }

          let program;

          function resize() {
            if (!ctn || !renderer) return;
            const scale = 1;
            const w = ctn.offsetWidth || window.innerWidth;
            const h = ctn.offsetHeight || window.innerHeight;
            renderer.setSize(w * scale, h * scale);
            if (program) {
              program.uniforms.uResolution.value = new OGLColor(
                gl.canvas.width,
                gl.canvas.height,
                gl.canvas.width / gl.canvas.height
              );
            }
          }
          window.addEventListener('resize', resize, false);

          const geometry = new OGLGeometry(gl, {
            position: { size: 2, data: new Float32Array([-1, -1, 3, -1, -1, 3]) },
            uv: { size: 2, data: new Float32Array([0, 0, 2, 0, 0, 2]) }
          });

          program = new OGLProgram(gl, {
            vertex: galaxyVertexShader,
            fragment: galaxyFragmentShader,
            uniforms: {
              uTime: { value: 0 },
              uResolution: {
                value: new OGLColor(gl.canvas.width || window.innerWidth, gl.canvas.height || window.innerHeight, (gl.canvas.width || 1) / (gl.canvas.height || 1))
              },
              uFocal: { value: new Float32Array(focal) },
              uRotation: { value: new Float32Array(rotation) },
              uStarSpeed: { value: starSpeed },
              uDensity: { value: density },
              uHueShift: { value: hueShift },
              uSpeed: { value: speed },
              uMouse: {
                value: new Float32Array([smoothMousePos.current.x, smoothMousePos.current.y])
              },
              uGlowIntensity: { value: glowIntensity },
              uSaturation: { value: saturation },
              uMouseRepulsion: { value: mouseRepulsion },
              uTwinkleIntensity: { value: twinkleIntensity },
              uRotationSpeed: { value: rotationSpeed },
              uRepulsionStrength: { value: repulsionStrength },
              uMouseActiveFactor: { value: 0.0 },
              uAutoCenterRepulsion: { value: autoCenterRepulsion },
              uTransparent: { value: transparent }
            }
          });

          resize();

          const mesh = new OGLMesh(gl, { geometry, program });

          function update(t) {
            if (!isMounted) return;
            animateId = requestAnimationFrame(update);
            if (!disableAnimation) {
              program.uniforms.uTime.value = t * 0.001;
              program.uniforms.uStarSpeed.value = (t * 0.001 * starSpeed) / 10.0;
            }

            const lerpFactor = 0.05;
            smoothMousePos.current.x += (targetMousePos.current.x - smoothMousePos.current.x) * lerpFactor;
            smoothMousePos.current.y += (targetMousePos.current.y - smoothMousePos.current.y) * lerpFactor;

            smoothMouseActive.current += (targetMouseActive.current - smoothMouseActive.current) * lerpFactor;

            program.uniforms.uMouse.value[0] = smoothMousePos.current.x;
            program.uniforms.uMouse.value[1] = smoothMousePos.current.y;
            program.uniforms.uMouseActiveFactor.value = smoothMouseActive.current;

            renderer.render({ scene: mesh });
          }
          animateId = requestAnimationFrame(update);
          ctn.appendChild(gl.canvas);

          function handleMouseMove(e) {
            if (!ctn) return;
            const rect = ctn.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = 1.0 - (e.clientY - rect.top) / rect.height;
            targetMousePos.current = { x, y };
            targetMouseActive.current = 1.0;
          }

          function handleMouseLeave() {
            targetMouseActive.current = 0.0;
          }

          if (mouseInteraction) {
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseleave', handleMouseLeave);
          }
        }

        startGL();

        return () => {
          isMounted = false;
          if (animateId) cancelAnimationFrame(animateId);
          if (ctn && renderer && renderer.gl && ctn.contains(renderer.gl.canvas)) {
            ctn.removeChild(renderer.gl.canvas);
          }
        };
      }, [
        focal,
        rotation,
        starSpeed,
        density,
        hueShift,
        disableAnimation,
        speed,
        mouseInteraction,
        glowIntensity,
        saturation,
        mouseRepulsion,
        twinkleIntensity,
        rotationSpeed,
        repulsionStrength,
        autoCenterRepulsion,
        transparent
      ]);

      return <div ref={ctnDom} className={`galaxy-container ${className}`} />;
    }

    // --- THREE.JS ORIGINKIT GLOBE COMPONENT ---
    const THREE_LIB = window.THREE;
    const {
      Scene,
      PerspectiveCamera,
      WebGLRenderer,
      SphereGeometry,
      MeshBasicMaterial,
      Color,
      Mesh,
      Group,
      InstancedMesh,
      Matrix4,
      Raycaster,
      Vector2,
      TubeGeometry,
      CatmullRomCurve3,
      Vector3,
      CanvasTexture,
    } = THREE_LIB;

    const D3_LIB = window.d3;
    const { geoEquirectangular, geoPath } = D3_LIB;

    function parseColorToRgba(input) {
      if (!input || input.trim() === "") return { r: 0, g: 0, b: 0, a: 0 };
      const str = input.trim();
      const rgbaMatch = str.match(
        /rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)/i
      );
      if (rgbaMatch) {
        const r = Math.max(0, Math.min(255, parseFloat(rgbaMatch[1]))) / 255;
        const g = Math.max(0, Math.min(255, parseFloat(rgbaMatch[2]))) / 255;
        const b = Math.max(0, Math.min(255, parseFloat(rgbaMatch[3]))) / 255;
        const a =
          rgbaMatch[4] !== undefined
            ? Math.max(0, Math.min(1, parseFloat(rgbaMatch[4])))
            : 1;
        return { r, g, b, a };
      }
      const hex = str.replace(/^#/, "");
      if (hex.length === 8) {
        return {
          r: parseInt(hex.slice(0, 2), 16) / 255,
          g: parseInt(hex.slice(2, 4), 16) / 255,
          b: parseInt(hex.slice(4, 6), 16) / 255,
          a: parseInt(hex.slice(6, 8), 16) / 255,
        };
      }
      if (hex.length === 6) {
        return {
          r: parseInt(hex.slice(0, 2), 16) / 255,
          g: parseInt(hex.slice(2, 4), 16) / 255,
          b: parseInt(hex.slice(4, 6), 16) / 255,
          a: 1,
        };
      }
      if (hex.length === 4) {
        return {
          r: parseInt(hex[0] + hex[0], 16) / 255,
          g: parseInt(hex[1] + hex[1], 16) / 255,
          b: parseInt(hex[2] + hex[2], 16) / 255,
          a: parseInt(hex[3] + hex[3], 16) / 255,
        };
      }
      if (hex.length === 3) {
        return {
          r: parseInt(hex[0] + hex[0], 16) / 255,
          g: parseInt(hex[1] + hex[1], 16) / 255,
          b: parseInt(hex[2] + hex[2], 16) / 255,
          a: 1,
        };
      }
      return { r: 0, g: 0, b: 0, a: 1 };
    }

    function mapLinear(value, inMin, inMax, outMin, outMax) {
      if (inMax === inMin) return outMin;
      const t = (value - inMin) / (inMax - inMin);
      return outMin + t * (outMax - outMin);
    }

    function mapSpeedUiToInternal(ui) {
      if (ui === 0) return 0;
      const clamped = Math.max(0, Math.min(10, ui));
      return mapLinear(clamped, 0, 10, 0, 0.9);
    }
    function mapDensityUiToSpacing(ui) {
      const clamped = Math.max(1, Math.min(10, ui));
      return mapLinear(clamped, 1, 10, 24, 8);
    }
    function mapScaleUiToMultiplier(ui) {
      const clamped = Math.max(1, Math.min(20, ui));
      return mapLinear(clamped, 1, 20, 0.2, 2);
    }
    function mapDotSizeUiToMultiplier(ui) {
      const clamped = Math.max(1, Math.min(10, ui));
      return mapLinear(clamped, 1, 10, 0.1, 0.5);
    }
    function mapMarkerDotSizeUiToMultiplier(ui) {
      const clamped = Math.max(0, Math.min(100, ui));
      return mapLinear(clamped, 0, 100, 0.1, 2.5);
    }
    function normalizeSmoothing(ui) {
      return Math.max(0, Math.min(1, ui / 10));
    }
    function mapDragSpeedUiToSensitivity(ui) {
      return mapLinear(Math.max(0, Math.min(10, ui)), 0, 10, 0.001, 0.02);
    }
    function mapDetailToStepSize(ui) {
      const clamped = Math.max(1, Math.min(10, ui));
      return mapLinear(clamped, 1, 10, 10, 1);
    }

    function simplifyRing(ring, detail) {
      if (ring.length < 2) return ring;
      if (detail >= 10) return ring;
      const stepSize = Math.max(1, Math.floor(mapDetailToStepSize(detail)));
      const simplified = [];
      simplified.push(ring[0]);
      for (let i = stepSize; i < ring.length - 1; i += stepSize) {
        const idx = Math.min(i, ring.length - 1);
        simplified.push(ring[idx]);
      }
      const lastPoint = ring[ring.length - 1];
      const firstPoint = ring[0];
      const isClosed =
        Math.abs(lastPoint[0] - firstPoint[0]) < 1e-4 &&
        Math.abs(lastPoint[1] - firstPoint[1]) < 1e-4;
      if (!isClosed) {
        simplified.push(lastPoint);
      }
      return simplified.length >= 2 ? simplified : ring;
    }

    function latLngToPosition(lat, lng) {
      const latRad = lat * (Math.PI / 180);
      const lngRad = lng * (Math.PI / 180);
      const x = Math.cos(latRad) * Math.sin(lngRad);
      const y = Math.sin(latRad);
      const z = Math.cos(latRad) * Math.cos(lngRad);
      return { x, y, z };
    }

    function Globe({
      speed = 2,
      smoothing = 8,
      dots = { color: "#ffffff", size: 5, density: 8, allDots: false },
      fill = "dots",
      fillColor = "#ffffff",
      scale = 8,
      stopOnHover = true,
      markerConfig = { markers: [], color: "#00f7ff", size: 40 },
      direction = "left",
      initialLatitude = 23,
      initialLongitude = -23,
      oceanColor = "#00000012",
      outlineColor = "#77CC7D",
      showOutline = true,
      graticuleColor = "#D4D4D4",
      showGrid = false,
      outlineWidth = 1,
      dragSpeed = 5,
      detail = 5,
      style,
    }) {
      const containerRef = useRef(null);
      const [, setIsLoading] = useState(true);
      const [error, setError] = useState(null);

      const dotColor = dots.color;
      const dotSize = dots.size;
      const density = dots.density;
      const allDots = dots.allDots;
      const gridWidth = 1;
      const smoothingN = normalizeSmoothing(smoothing);

      const baseRotationSpeed = mapSpeedUiToInternal(speed);
      const rotationSpeed =
        direction === "left" ? -baseRotationSpeed : baseRotationSpeed;
      const dotSpacing = mapDensityUiToSpacing(density);
      const dotSizeMultiplier = mapDotSizeUiToMultiplier(dotSize);
      const markerRadiusMultiplier = mapMarkerDotSizeUiToMultiplier(
        markerConfig.size
      );
      const scaleMultiplier = mapScaleUiToMultiplier(scale);

      useEffect(() => {
        if (!containerRef.current) return;
        const container = containerRef.current;
        const containerWidth =
          container.clientWidth || container.offsetWidth || 800;
        const containerHeight =
          container.clientHeight || container.offsetHeight || 600;

        const scene = new Scene();
        const camera = new PerspectiveCamera(
          50,
          containerWidth / containerHeight,
          0.1,
          1e3
        );
        const baseRadius = 1;
        const globeRadius = baseRadius * scaleMultiplier;
        const cameraDistance = 2.5 / scaleMultiplier;
        camera.position.set(0, 0, cameraDistance);
        camera.lookAt(0, 0, 0);

        const renderer = new WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(containerWidth, containerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = "srgb";
        const canvas = renderer.domElement;
        canvas.style.position = "absolute";
        canvas.style.inset = "0";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.display = "block";
        canvas.style.opacity = "0";
        canvas.style.visibility = "hidden";
        container.appendChild(canvas);

        const resolvedOceanColor = oceanColor;
        const resolvedOutlineColor = outlineColor;
        const resolvedDotColor = dotColor;
        const resolvedMarkerColor = markerConfig.color;
        const resolvedGraticuleColor = graticuleColor;
        const resolvedFillColor = fillColor;
        const oceanRgba = parseColorToRgba(resolvedOceanColor);
        const outlineRgba = parseColorToRgba(resolvedOutlineColor);
        const dotRgba = parseColorToRgba(resolvedDotColor);
        const markerRgba = parseColorToRgba(resolvedMarkerColor);
        const graticuleRgba = parseColorToRgba(resolvedGraticuleColor);
        const fillRgba = parseColorToRgba(resolvedFillColor);

        const oceanGeometry = new SphereGeometry(globeRadius, 64, 64);
        const oceanColorObj = resolvedOceanColor
          ? new Color(resolvedOceanColor)
          : new Color(0, 0, 0);
        const oceanMaterial = new MeshBasicMaterial({
          color: oceanColorObj,
          transparent: oceanRgba.a < 1 || oceanRgba.a === 0,
          opacity: oceanRgba.a,
        });
        const oceanMesh = new Mesh(oceanGeometry, oceanMaterial);
        scene.add(oceanMesh);

        let globeOutlineMesh = null;
        if (showOutline && outlineColor && outlineRgba.a > 0) {
          const outlinePositions = [];
          const segments = 128;
          for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const x = Math.cos(angle) * globeRadius;
            const y = Math.sin(angle) * globeRadius;
            const z = 0;
            outlinePositions.push(x, y, z);
          }
          const outlinePoints = [];
          for (let i = 0; i < outlinePositions.length; i += 3) {
            outlinePoints.push(
              new Vector3(
                outlinePositions[i],
                outlinePositions[i + 1],
                outlinePositions[i + 2]
              )
            );
          }
          if (outlinePoints.length >= 2) {
            outlinePoints.push(outlinePoints[0].clone());
            const outlineColorObj = new Color(resolvedOutlineColor);
            const outlineMaterial = new MeshBasicMaterial({
              color: outlineColorObj,
              transparent: outlineRgba.a < 1,
              opacity: outlineRgba.a,
            });
            const curve = new CatmullRomCurve3(outlinePoints);
            const radius = (outlineWidth / 10) * 0.01;
            const tubeGeometry = new TubeGeometry(
              curve,
              outlinePoints.length * 2,
              radius,
              8,
              false
            );
            globeOutlineMesh = new Mesh(tubeGeometry, outlineMaterial);
          }
        }

        const continentOutlineGroup = new Group();
        const graticuleGroup = new Group();
        if (showGrid && resolvedGraticuleColor && graticuleRgba.a > 0) {
          const graticuleColorObj = resolvedGraticuleColor
            ? new Color(resolvedGraticuleColor)
            : new Color(1, 1, 1);
          const graticuleMaterial = new MeshBasicMaterial({
            color: graticuleColorObj,
            transparent: graticuleRgba.a < 1 || graticuleRgba.a === 0,
            opacity: graticuleRgba.a,
          });
          const gridSpacing = 15;
          for (let lat = -90; lat <= 90; lat += gridSpacing) {
            const positions = [];
            const segments = 64;
            for (let i = 0; i <= segments; i++) {
              const lng = (i / segments) * 360 - 180;
              const pos = latLngToPosition(lat, lng);
              positions.push(
                pos.x * globeRadius,
                pos.y * globeRadius,
                pos.z * globeRadius
              );
            }
            if (positions && positions.length >= 6) {
              const points = [];
              for (let i = 0; i < positions.length; i += 3) {
                points.push(
                  new Vector3(
                    positions[i],
                    positions[i + 1],
                    positions[i + 2]
                  )
                );
              }
              if (points.length >= 2) {
                const curve = new CatmullRomCurve3(points);
                const radius = (gridWidth / 10) * 0.01;
                const tubeGeometry = new TubeGeometry(
                  curve,
                  points.length * 2,
                  radius,
                  8,
                  false
                );
                const tubeMesh = new Mesh(
                  tubeGeometry,
                  graticuleMaterial
                );
                tubeMesh.renderOrder = 0;
                graticuleGroup.add(tubeMesh);
              }
            }
          }
        }

        let dotInstances = null;
        let markerMeshes = [];

        const loadWorldData = async () => {
          try {
            setIsLoading(true);
            const response = await fetch(
              "https://raw.githubusercontent.com/martynafford/natural-earth-geojson/refs/heads/master/50m/physical/ne_50m_land.json"
            );
            if (!response.ok) throw new Error("Failed to load land data");
            const landFeatures = await response.json();

            while (continentOutlineGroup.children.length > 0) {
              continentOutlineGroup.remove(
                continentOutlineGroup.children[0]
              );
            }
            if (showOutline && outlineColor && outlineRgba.a > 0) {
              const outlineColorObj = new Color(resolvedOutlineColor);
              const outlineMaterial = new MeshBasicMaterial({
                color: outlineColorObj,
                transparent: outlineRgba.a < 1,
                opacity: outlineRgba.a,
                depthTest: true,
                depthWrite: true,
              });
              const projection = geoEquirectangular();
              const pathGenerator = geoPath().projection(projection);
              landFeatures.features.forEach((feature) => {
                const featureType =
                  feature.properties?.featurecla ||
                  feature.properties?.type ||
                  "";
                const featureName = feature.properties?.name || "";
                if (
                  featureType.toLowerCase().includes("graticule") ||
                  featureType.toLowerCase().includes("grid") ||
                  featureType.toLowerCase().includes("line") ||
                  featureName.toLowerCase().includes("graticule") ||
                  featureName.toLowerCase().includes("grid") ||
                  featureName.toLowerCase().includes("line")
                ) {
                  return;
                }
                const pathString = pathGenerator(feature);
                if (!pathString) return;

                const geometry = feature.geometry;
                if (!geometry || !geometry.coordinates) return;

                const processRing = (ring) => {
                  if (ring.length < 2) return;
                  const simplifiedRing = simplifyRing(ring, detail);
                  const positions = [];
                  simplifiedRing.forEach((coord) => {
                    const [lng, lat] = coord;
                    const pos = latLngToPosition(lat, lng);
                    positions.push(
                      pos.x * globeRadius,
                      pos.y * globeRadius,
                      pos.z * globeRadius
                    );
                  });
                  if (positions && positions.length >= 6) {
                    const points = [];
                    for (let i = 0; i < positions.length; i += 3) {
                      points.push(
                        new Vector3(
                          positions[i],
                          positions[i + 1],
                          positions[i + 2]
                        )
                      );
                    }
                    if (
                      points.length > 0 &&
                      points[0].distanceTo(
                        points[points.length - 1]
                      ) > 0.001
                    ) {
                      points.push(points[0].clone());
                    }
                    if (points.length >= 2) {
                      const curve = new CatmullRomCurve3(points);
                      const radius = (outlineWidth / 10) * 0.01;
                      const tubeGeometry = new TubeGeometry(
                        curve,
                        points.length * 2,
                        radius,
                        8,
                        false
                      );
                      const tubeMesh = new Mesh(
                        tubeGeometry,
                        outlineMaterial
                      );
                      tubeMesh.renderOrder = 0;
                      continentOutlineGroup.add(tubeMesh);
                    }
                  }
                };
                if (
                  geometry.type === "Polygon" &&
                  geometry.coordinates.length > 0
                ) {
                  processRing(geometry.coordinates[0]);
                } else if (geometry.type === "MultiPolygon") {
                  geometry.coordinates.forEach((polygon) => {
                    if (polygon.length > 0) {
                      processRing(polygon[0]);
                    }
                  });
                }
              });
            }

            const bitmapWidth = 2048;
            const bitmapHeight = 1024;
            const offscreenCanvas = document.createElement("canvas");
            offscreenCanvas.width = bitmapWidth;
            offscreenCanvas.height = bitmapHeight;
            const ctx = offscreenCanvas.getContext("2d", {
              willReadFrequently: true,
            });
            if (!ctx) throw new Error("Canvas not supported");
            const projection = geoEquirectangular().fitSize(
              [bitmapWidth, bitmapHeight],
              { type: "Sphere" }
            );
            const pathGenerator = geoPath()
              .projection(projection)
              .context(ctx);
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, bitmapWidth, bitmapHeight);
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            landFeatures.features.forEach((feature) => {
              pathGenerator(feature);
            });
            ctx.fill();
            const imageData = ctx.getImageData(
              0,
              0,
              bitmapWidth,
              bitmapHeight
            );
            const pixels = imageData.data;
            const isOnLand = (lng, lat) => {
              const x =
                Math.round(((lng + 180) / 360) * bitmapWidth) %
                bitmapWidth;
              const y = Math.round(((90 - lat) / 180) * bitmapHeight);
              const clampedY = Math.max(0, Math.min(bitmapHeight - 1, y));
              const idx = (clampedY * bitmapWidth + x) * 4;
              return pixels[idx] > 128;
            };

            if (fill === "solid") {
              const texW = 1024;
              const texH = 512;
              const fillCanvas = document.createElement("canvas");
              fillCanvas.width = texW;
              fillCanvas.height = texH;
              const fctx = fillCanvas.getContext("2d");
              const img = fctx.createImageData(texW, texH);
              const data = img.data;
              const fr = Math.round(fillRgba.r * 255);
              const fg = Math.round(fillRgba.g * 255);
              const fb = Math.round(fillRgba.b * 255);
              const fa = Math.round((fillRgba.a || 1) * 255);
              for (let ty = 0; ty < texH; ty++) {
                for (let tx = 0; tx < texW; tx++) {
                  const u = tx / texW;
                  const v = ty / texH;
                  let lng = (u - 0.25) * 360;
                  lng = ((((lng + 180) % 360) + 360) % 360) - 180;
                  const lat = (v - 0.5) * 180;
                  const onLand = allDots || isOnLand(lng, lat);
                  const idx = (ty * texW + tx) * 4;
                  if (onLand) {
                    data[idx] = fr;
                    data[idx + 1] = fg;
                    data[idx + 2] = fb;
                    data[idx + 3] = fa;
                  } else {
                    data[idx + 3] = 0;
                  }
                }
              }
              fctx.putImageData(img, 0, 0);
              const fillTexture = new CanvasTexture(fillCanvas);
              fillTexture.flipY = false;
              fillTexture.needsUpdate = true;
              const fillGeometry = new SphereGeometry(
                globeRadius * 1.002,
                64,
                64
              );
              const fillMaterial = new MeshBasicMaterial({
                map: fillTexture,
                transparent: true,
              });
              dotInstances = new Mesh(fillGeometry, fillMaterial);
              globeGroup.add(dotInstances);
            } else {
              const dotCoordinates = [];
              const baseStep = dotSpacing * 0.08;
              for (let lat = -90; lat <= 90; lat += baseStep) {
                const latRad = (Math.abs(lat) * Math.PI) / 180;
                const cosLat = Math.cos(latRad);
                const lngStep =
                  cosLat > 0.01
                    ? baseStep / Math.max(0.3, cosLat)
                    : 360;
                for (let lng = -180; lng < 180; lng += lngStep) {
                  if (allDots || isOnLand(lng, lat)) {
                    dotCoordinates.push([lng, lat]);
                  }
                }
              }

              if (dotCoordinates.length > 0) {
                const dotGeometry = new SphereGeometry(
                  0.01 * dotSizeMultiplier,
                  4,
                  4
                );
                const dotColorObj = resolvedDotColor
                  ? new Color(resolvedDotColor)
                  : new Color(0.6, 0.6, 0.6);
                const dotMaterial = new MeshBasicMaterial({
                  color: dotColorObj,
                  transparent: dotRgba.a < 1 || dotRgba.a === 0,
                  opacity: dotRgba.a,
                });
                const instanced = new InstancedMesh(
                  dotGeometry,
                  dotMaterial,
                  dotCoordinates.length
                );
                const matrix = new Matrix4();
                for (let i = 0; i < dotCoordinates.length; i++) {
                  const [lng, lat] = dotCoordinates[i];
                  const pos = latLngToPosition(lat, lng);
                  matrix.makeScale(1, 1, 1);
                  matrix.setPosition(
                    pos.x * globeRadius,
                    pos.y * globeRadius,
                    pos.z * globeRadius
                  );
                  instanced.setMatrixAt(i, matrix);
                }
                instanced.instanceMatrix.needsUpdate = true;
                dotInstances = instanced;
                globeGroup.add(dotInstances);
              }
            }

            updateMarkers();
            renderer.render(scene, camera);
            canvas.style.opacity = "1";
            canvas.style.visibility = "visible";
            setIsLoading(false);
          } catch (err) {
            setError("Failed to load land map data");
            setIsLoading(false);
          }
        };

        const updateMarkers = () => {
          markerMeshes.forEach((mesh) => globeGroup.remove(mesh));
          markerMeshes = [];
          if (markerConfig.markers && markerConfig.markers.length > 0) {
            const markerSize = 0.01 * markerRadiusMultiplier;
            const markerGeometry = new SphereGeometry(markerSize, 16, 16);
            const markerColorObj = resolvedMarkerColor
              ? new Color(resolvedMarkerColor)
              : new Color(1, 1, 1);
            const markerMaterial = new MeshBasicMaterial({
              color: markerColorObj,
            });
            markerConfig.markers.forEach((marker) => {
              if (
                !marker ||
                typeof marker.lat !== "number" ||
                typeof marker.lng !== "number"
              )
                return;
              const pos = latLngToPosition(marker.lat, marker.lng);
              const markerMesh = new Mesh(
                markerGeometry,
                markerMaterial.clone()
              );
              markerMesh.position.set(
                pos.x * globeRadius,
                pos.y * globeRadius,
                pos.z * globeRadius
              );
              globeGroup.add(markerMesh);
              markerMeshes.push(markerMesh);
            });
          }
        };

        const initialLongitudeRad = (initialLongitude * Math.PI) / 180;
        const initialLatitudeRad = (initialLatitude * Math.PI) / 180;
        const rotation = { x: initialLongitudeRad, y: initialLatitudeRad };
        const targetRotation = {
          x: initialLongitudeRad,
          y: initialLatitudeRad,
        };
        const velocity = { x: 0, y: 0 };
        let isDragging = false;
        let isHovering = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let animationFrameId = null;
        const lerpFactor =
          smoothingN === 0 ? 1 : mapLinear(smoothingN, 0, 1, 0.4, 0.03);
        const velocityDecay = mapLinear(smoothingN, 0, 1, 0.7, 0.96);

        const globeGroup = new Group();
        globeGroup.rotation.y = initialLongitudeRad;
        globeGroup.rotation.x = initialLatitudeRad;
        scene.add(globeGroup);
        globeGroup.add(oceanMesh);
        if (showGrid && graticuleColor && graticuleRgba.a > 0) {
          globeGroup.add(graticuleGroup);
        }
        globeGroup.add(continentOutlineGroup);
        markerMeshes.forEach((mesh) => globeGroup.add(mesh));

        const animate = () => {
          let needsRender = false;
          const threshold = 0.01;
          if (
            !isDragging &&
            rotationSpeed !== 0 &&
            (!stopOnHover || !isHovering)
          ) {
            targetRotation.x += rotationSpeed * 0.01;
          }
          if (!isDragging && smoothingN > 0) {
            if (
              Math.abs(velocity.x) > threshold ||
              Math.abs(velocity.y) > threshold
            ) {
              targetRotation.x += velocity.x;
              targetRotation.y += velocity.y;
              targetRotation.y = Math.max(
                -Math.PI / 2,
                Math.min(Math.PI / 2, targetRotation.y)
              );
              velocity.x *= velocityDecay;
              velocity.y *= velocityDecay;
            } else {
              velocity.x = 0;
              velocity.y = 0;
            }
          }
          const dx = targetRotation.x - rotation.x;
          const dy = targetRotation.y - rotation.y;
          if (
            Math.abs(dx) > threshold ||
            Math.abs(dy) > threshold ||
            rotationSpeed !== 0 ||
            isDragging
          ) {
            rotation.x += dx * lerpFactor;
            rotation.y += dy * lerpFactor;
            rotation.y = Math.max(
              -Math.PI / 2,
              Math.min(Math.PI / 2, rotation.y)
            );
            needsRender = true;
          }
          if (needsRender || rotationSpeed !== 0 || isDragging) {
            globeGroup.rotation.y = rotation.x;
            globeGroup.rotation.x = rotation.y;
            renderer.render(scene, camera);
          }
          const hasVelocity =
            Math.abs(velocity.x) > threshold ||
            Math.abs(velocity.y) > threshold;
          const hasLerpDelta =
            Math.abs(dx) > threshold || Math.abs(dy) > threshold;
          const needsContinue =
            isDragging || rotationSpeed !== 0 || hasVelocity || hasLerpDelta;
          if (needsContinue) {
            animationFrameId = requestAnimationFrame(animate);
          } else {
            animationFrameId = null;
          }
        };

        const startAnimation = () => {
          if (animationFrameId === null) {
            animationFrameId = requestAnimationFrame(animate);
          }
        };
        if (rotationSpeed !== 0) {
          startAnimation();
        }

        const handleMouseDown = (event) => {
          isDragging = true;
          velocity.x = 0;
          velocity.y = 0;
          lastMouseX = event.clientX;
          lastMouseY = event.clientY;
          startAnimation();
          const handleMouseMoveDrag = (moveEvent) => {
            const sensitivity = mapDragSpeedUiToSensitivity(dragSpeed);
            const dx = moveEvent.clientX - lastMouseX;
            const dy = moveEvent.clientY - lastMouseY;
            targetRotation.x += dx * sensitivity;
            targetRotation.y += dy * sensitivity;
            targetRotation.y = Math.max(
              -Math.PI / 2,
              Math.min(Math.PI / 2, targetRotation.y)
            );
            velocity.x = dx * sensitivity * 0.3;
            velocity.y = dy * sensitivity * 0.3;
            lastMouseX = moveEvent.clientX;
            lastMouseY = moveEvent.clientY;
          };
          const handleMouseUp = () => {
            document.removeEventListener("mousemove", handleMouseMoveDrag);
            document.removeEventListener("mouseup", handleMouseUp);
            isDragging = false;
          };
          document.addEventListener("mousemove", handleMouseMoveDrag);
          document.addEventListener("mouseup", handleMouseUp);
        };
        canvas.addEventListener("mousedown", handleMouseDown);

        const raycaster = new Raycaster();
        const mouse = new Vector2();
        const handleMouseMove = (event) => {
          if (!stopOnHover) return;
          const rect = canvas.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObject(oceanMesh);
          isHovering = intersects.length > 0;
        };
        canvas.addEventListener("mousemove", handleMouseMove);

        const resizeObserver = new ResizeObserver(() => {
          const newWidth =
            container.clientWidth || container.offsetWidth || 800;
          const newHeight =
            container.clientHeight || container.offsetHeight || 600;
          camera.aspect = newWidth / newHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(newWidth, newHeight);
          const newCameraDistance = 2.5 / scaleMultiplier;
          camera.position.set(0, 0, newCameraDistance);
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
        });
        resizeObserver.observe(container);

        loadWorldData();

        return () => {
          if (animationFrameId !== null)
            cancelAnimationFrame(animationFrameId);
          canvas.removeEventListener("mousedown", handleMouseDown);
          canvas.removeEventListener("mousemove", handleMouseMove);
          resizeObserver.disconnect();
          renderer.dispose();
          container.removeChild(canvas);
        };
      }, [
        speed,
        smoothing,
        dots,
        fill,
        fillColor,
        allDots,
        density,
        dotSize,
        dotColor,
        scale,
        stopOnHover,
        markerConfig,
        direction,
        initialLatitude,
        initialLongitude,
        oceanColor,
        outlineColor,
        showOutline,
        graticuleColor,
        showGrid,
        outlineWidth,
        dragSpeed,
        detail,
        rotationSpeed,
        dotSpacing,
        dotSizeMultiplier,
        markerRadiusMultiplier,
        scaleMultiplier,
      ]);

      const containerStyle = {
        ...style,
        position: "relative",
        width: "100%",
        height: "100%",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
      };

      if (error) {
        return (
          <div style={containerStyle}>
            <div
              style={{
                position: "relative",
                width: "100%",
                height: "100%",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
                color: "#ffffff",
                textAlign: "center",
                padding: "16px",
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
              }}
            >
              <div style={{ fontSize: "16px", fontWeight: 600 }}>
                Error loading Earth visualization
              </div>
              <div style={{ fontSize: "13px", opacity: 0.7, marginTop: "4px" }}>
                {error}
              </div>
            </div>
          </div>
        );
      }

      return <div ref={containerRef} style={containerStyle} />;
    }

    function App() {
      return (
        <ErrorBoundary>
          <div style={{ width: '100vw', height: '100vh', backgroundColor: '#000000', position: 'relative' }}>
            {/* React Bits Galaxy Component as Background */}
            <Galaxy
              mouseRepulsion={true}
              mouseInteraction={true}
              density={2.5}
              glowIntensity={2.0}
              saturation={1.0}
              hueShift={240}
              starSpeed={0.8}
              twinkleIntensity={0.6}
              rotationSpeed={0.15}
              transparent={true}
            />

            {/* 3D Originkit Globe Component Overlay */}
            <div className="globe-wrapper">
              <Globe
                speed={2}
                smoothing={8}
                dots={{ color: "#ffffff", size: 5, density: 8, allDots: false }}
                fill="dots"
                fillColor="#ffffff"
                scale={8}
                stopOnHover={true}
                markerConfig={{ markers: [{ lat: 19.2062, lng: 72.8738 }, { lat: 43.6532, lng: -79.3832 }], color: "#77CC7D", size: 40 }}
                direction="left"
                initialLatitude={23}
                initialLongitude={-23}
                oceanColor="#00000012"
                outlineColor="#77CC7D"
                showOutline={true}
                graticuleColor="#D4D4D4"
                showGrid={false}
                outlineWidth={1}
                dragSpeed={5}
                detail={5}
              />
            </div>
          </div>
        </ErrorBoundary>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
