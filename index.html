            container.clientWidth || container.offsetWidth || 800;
          const newHeight =
            container.clientHeight || container.offsetHeight || 600;
          camera.aspect = newWidth / newHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(newWidth, newHeight);
          const newCameraDistance = globeRadius * 2.6;
          camera.position.set(0, 0, newCameraDistance);
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
        });
        resizeObserver.observe(container);

        loadWorldData();

        return () => {
          if (animationFrameId !== null)
            cancelAnimationFrame(animationFrameId);
          canvas.removeEventListener("mousedown", handleMouseDown);
          canvas.removeEventListener("mousemove", handleMouseMove);
          resizeObserver.disconnect();
          renderer.dispose();
          container.removeChild(canvas);
        };
      }, [
        speed,
        smoothing,
        dots,
        fill,
        fillColor,
        allDots,
        density,
        dotSize,
        dotColor,
        scale,
        stopOnHover,
        markerConfig,
        direction,
        initialLatitude,
        initialLongitude,
        oceanColor,
        outlineColor,
        showOutline,
        graticuleColor,
        showGrid,
        outlineWidth,
        dragSpeed,
        detail,
        rotationSpeed,
        dotSpacing,
        dotSizeMultiplier,
        markerRadiusMultiplier,
        scaleMultiplier,
      ]);

      const containerStyle = {
        ...style,
        position: "relative",
        width: "100%",
        height: "100%",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
      };

      if (error) {
        return (
          <div style={containerStyle}>
            <div
              style={{
                position: "relative",
                width: "100%",
                height: "100%",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
                color: "#ffffff",
                textAlign: "center",
                padding: "16px",
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
              }}
            >
              <div style={{ fontSize: "16px", fontWeight: 600 }}>
                Error loading Earth visualization
              </div>
              <div style={{ fontSize: "13px", opacity: 0.7, marginTop: "4px" }}>
                {error}
              </div>
            </div>
          </div>
        );
      }

      return <div ref={containerRef} style={containerStyle} />;
    }

    function App() {
      return (
        <ErrorBoundary>
          <div style={{ width: '100vw', height: '100vh', backgroundColor: '#000000', position: 'relative' }}>
            {/* Top Left .Tensor Particle Text Logo */}

            {/* Layer 2: 3D Globe Overlay (zIndex 2) */}

                fill="dots"

                markerConfig={{

                    { lat: 35.6762, lng: 139.6503 }  // Tokyo

                oceanColor="#080808"

            </div>

            {/* Layer 3: Main Minimal Hero Section (zIndex 20) */}
            <div className="hero-overlay">
              <div style={{ margin: '0.2rem 0' }}>
                <DepthText
                  text="ECO LIFE"

              </div>

              <MaskedHeading
                text="Track your carbon footprint, reduce waste daily, and manage your environmental impact in real-time."
                tag="p"

                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23ffffff'/></svg>"
                fillScale={1.2}
                parallax={0}

                brightness={1}

                reveal="rise"

                stagger={0.06}

              />

              <div className="btn-group">
                <a href="dashboard.html" className="btn-primary">
                  Get Started →
                </a>
                <a href="auth.html" className="btn-secondary">
                  Sign In
                </a>
              </div>
            </div>
          </div>
        </ErrorBoundary>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
